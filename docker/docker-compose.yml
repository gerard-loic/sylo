services:
  sylo:
    container_name: '${COMPOSE_PROJECT_NAME}'
    build:
      context: ../
      dockerfile: docker/Dockerfile
    volumes:
      - ../:${COMPOSE_PROJECT_PATH}
      # Volumes anonymes : masquent le .venv et les caches de l'hôte (Python 3.13
      # miniforge) qui fuiraient via le bind mount ci-dessus et casseraient
      # ./cmd.sh dans le conteneur (Python 3.12 de l'image).
      - ${COMPOSE_PROJECT_PATH}/.venv
      - ${COMPOSE_PROJECT_PATH}/__pycache__
      # Code propre au projet (entités, gabarits d'emails, config, scripts, libs,
      # voir custom/README.md). Bind mount explicite pour que les fichiers écrits
      # dans le conteneur (ex: make cmd c="generate_entities ...") restent
      # accessibles/éditables sur l'hôte et survivent à un recreate. Redondant tant
      # que `../:/app` ci-dessus est présent, mais indispensable si le service
      # tourne depuis l'image publiée (`image: ghcr.io/...`) sans ce mount global.
      # Une modification de custom/requirements.txt impose un rebuild (make up).
      - ../custom:${COMPOSE_PROJECT_PATH}/custom
    restart: ${COMPOSE_RESTART_POLICY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=http"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8002"
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true