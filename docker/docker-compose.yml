services:
  sylo:
    container_name: '${COMPOSE_PROJECT_NAME}'
    build:
      context: ../
      dockerfile: docker/Dockerfile
    volumes:
      - ../:${COMPOSE_PROJECT_PATH}
      # Volumes anonymes : masquent le .venv et les caches de l'hôte (Python 3.13
      # miniforge) qui fuiraient via le bind mount ci-dessus et casseraient
      # ./cmd.sh dans le conteneur (Python 3.12 de l'image).
      - ${COMPOSE_PROJECT_PATH}/.venv
      - ${COMPOSE_PROJECT_PATH}/__pycache__
      # Entités du projet : générées au runtime par `scripts/generate_entities.py`
      # (make cmd c="generate_entities ..."). Bind mount explicite pour que les
      # fichiers écrits dans le conteneur restent accessibles/éditables sur l'hôte
      # et survivent à un recreate. Redondant tant que `../:/app` ci-dessus est
      # présent, mais indispensable si le service tourne depuis l'image publiée
      # (`image: ghcr.io/...`) sans ce mount global.
      # Le dossier hôte ../entities/ DOIT contenir __init__.py (le loader embarqué
      # dans l'image, requis par app/main.py) : ce mount le masque sinon.
      - ../entities:${COMPOSE_PROJECT_PATH}/entities
      # Gabarits d'emails : les gabarits par défaut sont embarqués dans l'image
      # (app/mail/templates/, non masqué par ce mount). Le dossier hôte ../mails/
      # sert uniquement à les surcharger (fichier de même nom) ou à en ajouter
      # de nouveaux.
      - ../mails:${COMPOSE_PROJECT_PATH}/mails
      # Fichiers de configuration des scripts (ex: generate-config.json), fournis
      # au runtime. Usage : make cmd c="generate_entities --config-file config/generate-config.json"
      - ../config:${COMPOSE_PROJECT_PATH}/config
    restart: ${COMPOSE_RESTART_POLICY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=http"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8002"
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true